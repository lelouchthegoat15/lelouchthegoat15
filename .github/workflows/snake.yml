name: The Black Knights advance

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#e3b84f&color_dots=#161b22,#4a0b1c,#7d0f2c,#b8123a,#ff3d5e
            dist/snake-light.svg?color_snake=#5b2a86&color_dots=#ebedf0,#f6c4cf,#ec8aa0,#d93a5c,#a8102e

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
